android.useAndroidX=true
android.enableJetifier=false

# Single JVM strategy: Kotlin compiles in-process so we only have ONE JVM
# D8 also runs in the Gradle worker (no isolation), so this heap covers everything
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC
org.gradle.workers.max=1
org.gradle.daemon=false

# Fix TLS handshake failures on Termux (dl.google.com rejects TLS 1.3 from OpenJDK 17)
systemProp.https.protocols=TLSv1.2

# Longer timeouts for slow Termux network
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Retry failed dependency downloads (helps with flaky Termux network)
systemProp.org.gradle.internal.publish.checksums.insecure=true

# Suppress AGP warnings
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,GENERIC
